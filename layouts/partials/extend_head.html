<!-- ==================== 顶栏（三段式导航） ==================== -->
<style>
:root {
    /* 强调色：由左下角调色板浮窗切换，全部金色系写法都从这组令牌派生 */
    --accent: #d4af37;
    --accent-rgb: 212, 175, 55;
    --accent-deep: #7a5c00;
    --accent-contrast: #241a02;
    --gold: var(--accent);
    --gold-soft: rgba(var(--accent-rgb), 0.12);
    --gold-border: rgba(var(--accent-rgb), 0.35);
    --card-bg: #ffffff;
    --card-bg-dark: #1d1b17;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    /* 中性发丝线与多层弥散阴影：质感更细腻柔和 */
    --line-light: rgba(28, 22, 8, 0.08);
    --line-dark: rgba(255, 255, 255, 0.08);
    --line: var(--line-light);
    --shadow-rest: 0 1px 3px rgba(0, 0, 0, 0.03), 0 6px 18px -2px rgba(0, 0, 0, 0.06);
    --shadow-pop: 0 4px 12px rgba(0, 0, 0, 0.05), 0 12px 28px -4px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(var(--accent-rgb), 0.25);
    --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
    --nav-pill-bg: color-mix(in srgb, var(--accent) 8%, rgba(255, 252, 245, 0.95));
    --nav-pill-border: rgba(var(--accent-rgb), 0.35);
    --nav-text: color-mix(in srgb, var(--accent-deep) 65%, #2f2712);
    --nav-hover-bg: rgba(var(--accent-rgb), 0.22);
    --nav-hover-text: var(--accent-deep);
    --nav-dropdown-bg: color-mix(in srgb, var(--accent) 5%, #fffdfa);
    --nav-dropdown-text: var(--nav-text);
    --nav-dropdown-hover: rgba(var(--accent-rgb), 0.14);
    --site-header-text: var(--nav-text);
    --icon-btn-hover: rgba(var(--accent-rgb), 0.18);
    --drawer-bg: var(--nav-dropdown-bg);
    --drawer-text: var(--nav-text);
}
html[data-theme="dark"] {
    --card-bg-dark: #1b1915;
    --line: var(--line-dark);
    --shadow-rest: 0 2px 6px rgba(0, 0, 0, 0.35), 0 8px 24px -2px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
    --shadow-pop: 0 6px 18px rgba(0, 0, 0, 0.45), 0 16px 36px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(var(--accent-rgb), 0.45);
    --nav-pill-bg: color-mix(in srgb, var(--accent) 5%, rgba(28, 26, 21, 0.92));
    --nav-pill-border: rgba(var(--accent-rgb), 0.4);
    --nav-text: color-mix(in srgb, var(--accent) 32%, #e6e3dc);
    --nav-hover-bg: rgba(var(--accent-rgb), 0.28);
    --nav-hover-text: var(--accent);
    --nav-dropdown-bg: color-mix(in srgb, var(--accent) 7%, #1e1b16);
    --nav-dropdown-text: var(--nav-text);
    --nav-dropdown-hover: rgba(var(--accent-rgb), 0.16);
    --site-header-text: color-mix(in srgb, var(--accent) 42%, #f0ede4);
    --icon-btn-hover: rgba(var(--accent-rgb), 0.22);
    --drawer-bg: color-mix(in srgb, var(--accent) 6%, #1a1813);
    --drawer-text: var(--nav-text);
}
/* 统一光标：UI 上不出现多余的文本光标 */
body {
    cursor: default;
}
input,
textarea,
select {
    cursor: text;
}
input[type="range"] {
    cursor: pointer;
}
a,
button {
    cursor: pointer;
}
:where(a, button, input, textarea, select):focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
}
.site-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 20px;
    background: transparent;
    transition: transform 0.3s ease;
}
.site-header.hidden-nav {
    transform: translateY(-100%);
}
/* 滚动后顶栏加毛玻璃底，避免胶囊之间漏出正文 */
.site-header.scrolled {
    background: rgba(15, 14, 12, 0.72);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
}
html[data-theme="light"] .site-header.scrolled {
    background: rgba(250, 249, 246, 0.78);
}
/* 内页标题体系：统一字号节奏与金色侧标 */
.page-header h1,
.list-header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
}
.page-header h1::before,
.list-header h1::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 1.05em;
    border-radius: 2px;
    background: var(--gold);
    margin-right: 12px;
    vertical-align: -0.12em;
}
.site-brand {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 14px;
    box-sizing: border-box;
    gap: 9px;
    border-radius: 999px;
    background: var(--nav-pill-bg);
    border: 1px solid var(--nav-pill-border);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}
.site-brand-link {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--site-header-text);
}
.site-brand-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}
.site-brand-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
}
.nav-pill {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    height: 40px;
    gap: 2px;
    padding: 4px;
    box-sizing: border-box;
    background: var(--nav-pill-bg);
    border: 1px solid var(--nav-pill-border);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}
.nav-indicator {
    position: absolute;
    top: 4px;
    left: 0;
    height: 32px;
    width: 0;
    pointer-events: none;
    border-radius: 999px;
    background: var(--nav-hover-bg);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.22);
    opacity: 0;
    transform: translate3d(0, 0, 0);
    transition: transform 0.24s cubic-bezier(0.25, 1, 0.5, 1), width 0.24s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.18s ease;
    z-index: 1;
}
.nav-indicator.is-active {
    opacity: 1;
}
@keyframes nav-pill-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.18); }
    50% { box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.40); }
}
.nav-indicator.has-active {
    animation: nav-pill-pulse 3s infinite ease-in-out;
}
.nav-item {
    position: relative;
    z-index: 2;
}
.nav-link {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--nav-text);
    background: transparent;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: color 0.18s;
    font-family: inherit;
}
.nav-link:hover,
.nav-link.active,
.nav-dropdown-trigger:hover,
.nav-dropdown-trigger.active {
    color: var(--nav-hover-text);
}
.nav-caret {
    font-size: 0.7em;
    opacity: 0.75;
    transition: transform 0.18s;
}
.nav-item.is-open .nav-caret { transform: rotate(180deg); }
.nav-dropdown {
    position: absolute;
    top: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(-8px) scale(0.96);
    transform-origin: top center;
    min-width: 172px;
    padding: 8px;
    background: var(--nav-dropdown-bg);
    border: 1px solid var(--nav-pill-border);
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.22s var(--ease-out), transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
    z-index: 1200;
}
.nav-item.is-open .nav-dropdown {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0) scale(1);
}
.nav-item.is-open .nav-dropdown-item {
    animation: dropdown-item-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
.nav-item.is-open .nav-dropdown-item:nth-child(1) { animation-delay: 0.02s; }
.nav-item.is-open .nav-dropdown-item:nth-child(2) { animation-delay: 0.05s; }
.nav-item.is-open .nav-dropdown-item:nth-child(3) { animation-delay: 0.08s; }
.nav-item.is-open .nav-dropdown-item:nth-child(4) { animation-delay: 0.11s; }
.nav-item.is-open .nav-dropdown-item:nth-child(5) { animation-delay: 0.14s; }
@keyframes dropdown-item-enter {
    from {
        opacity: 0;
        transform: translateY(-4px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.nav-dropdown-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 0.88rem;
    color: var(--nav-dropdown-text);
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
}
.nav-dropdown-item:hover,
.nav-dropdown-item.active {
    background: var(--nav-dropdown-hover);
    color: var(--nav-hover-text);
}
.nav-dropdown-icon { font-size: 1rem; line-height: 1; }
.nav-dropdown-icon svg,
.drawer-subicon svg { width: 16px; height: 16px; display: block; }
.site-actions {
    display: flex;
    align-items: center;
    height: 40px;
    gap: 4px;
    padding: 0 6px;
    box-sizing: border-box;
    border-radius: 999px;
    background: var(--nav-pill-bg);
    border: 1px solid var(--nav-pill-border);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    flex-shrink: 0;
}
.icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--site-header-text);
    cursor: pointer;
    transition: background 0.18s;
}
.icon-btn:hover { background: var(--icon-btn-hover); }
/* 触屏/窄屏下把按钮热区扩到约 46px（不改布局，伪元素点击归按钮本身），降低误触 */
@media (hover: none), (max-width: 1023px) {
    .icon-btn { position: relative; }
    .icon-btn::after {
        content: '';
        position: absolute;
        inset: -7px;
        border-radius: 50%;
    }
}
.kbd-hint {
    font-size: 0.68rem;
    color: var(--nav-text);
    background: transparent;
    border: 1px solid var(--nav-pill-border);
    padding: 3px 7px;
    border-radius: 8px;
    white-space: nowrap;
}
.nav-menu-switch { display: none; }
.nav-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
    z-index: 11000;
}
.nav-drawer-overlay.open { opacity: 1; visibility: visible; }
.nav-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(320px, 86vw);
    background: var(--drawer-bg);
    color: var(--drawer-text);
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 11001;
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
}
.nav-drawer.open { transform: translateX(0); }
.nav-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--nav-pill-border);
    margin-bottom: 10px;
}
.nav-drawer-menu { list-style: none; margin: 0; padding: 0; }
.drawer-item { margin: 2px 0; }
.drawer-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--drawer-text);
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    text-align: left;
}
.drawer-link:hover,
.drawer-link.active { background: var(--nav-hover-bg); color: var(--nav-hover-text); }
.drawer-caret { font-size: 0.75em; transition: transform 0.2s; }
.drawer-item.is-open > .drawer-link .drawer-caret { transform: rotate(180deg); }
.drawer-submenu {
    list-style: none;
    margin: 0;
    padding: 0 0 0 14px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;

            <button id="mute-btn" class="vol-icon" title="静音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>

<audio id="bg-music" src="" preload="metadata"></audio>

<script>
// ==================== 播放器脚本（支持页面跳转后继续播放） ====================
const playlists = {
    {{- $musicFiles := readDir "static/music" }}
    {{- $allNames := slice }}
    {{- range $m := $musicFiles }}
        {{- $ext := $m.Name | path.Ext }}
        {{- if and (not $m.IsDir) (or (eq $ext ".mp3") (eq $ext ".m4a") (eq $ext ".ogg") (eq $ext ".flac") (eq $ext ".wav")) }}
            {{- $allNames = $allNames | append $m.Name }}
        {{- end }}
    {{- end }}
    {{- $allOrder := $allNames }}
    {{- range $pl := hugo.Data.music.playlists }}
        {{- if and (eq $pl.name "全部") $pl.order }}
            {{- $allOrder = $pl.order }}
        {{- end }}
    {{- end }}
    {{- range $allNames }}{{ if not (in $allOrder .) }}{{ $allOrder = $allOrder | append . }}{{ end }}{{ end }}
    {{- $defs := slice (dict "name" "全部" "order" $allOrder) }}
    {{- range $pl := hugo.Data.music.playlists }}
        {{- if ne $pl.name "全部" }}
            {{- $defs = $defs | append (dict "name" $pl.name "order" ($pl.order | default slice)) }}
        {{- end }}
    {{- end }}
    {{- range $pl := $defs }}
    {{ printf "%q" $pl.name | safeJS }}: [
        {{- range $fname := $pl.order }}
            {{- if (in $allNames $fname) }}
                {{- $ext := $fname | path.Ext }}
                {{- $fullTitle := replace $fname $ext "" }}
                {{- $parts := split $fullTitle " - " }}
                {{- $artist := index $parts 0 }}
                {{- $song := $fullTitle }}
                {{- if gt (len $parts) 1 }}{{ $song = index $parts 1 }}{{ end }}
                { title: {{ printf "%q" $song | safeJS }}, artist: {{ printf "%q" $artist | safeJS }}, cover: "/images/player-cover.jpg", src: {{ printf "%q" (printf "https://cdn.jsdelivr.net/gh/MCRYII/MCRYII.github.io@master/static/music/%s" ($fname | urlquery)) | safeJS }}, localSrc: {{ printf "%q" (printf "/music/%s" $fname) | safeJS }} },
            {{- else }}null,{{- end }}
        {{- end }}
    ],
    {{- end }}
};
Object.keys(playlists).forEach(function (k) {
    playlists[k] = playlists[k].filter(function (t) { return t && t.src; });
});
let currentPlaylistName = "全部";
let playlist = playlists[currentPlaylistName] || [];
let currentTrackIndex = 0;
let savedTime = 0;
let shouldPlay = false;
const audio = document.getElementById('bg-music');
const playPauseBtn = document.getElementById('play-pause-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const seekBar = document.getElementById('seek-bar');
const currentTimeSpan = document.getElementById('current-time');
const durationTimeSpan = document.getElementById('duration-time');
const volumeSlider = document.getElementById('volume-slider');
const albumCover = document.getElementById('album-cover');
const songTitleSpan = document.getElementById('song-title');
const songArtistSpan = document.getElementById('song-artist');
const playlistToggle = document.getElementById('playlist-toggle');
const playlistPanel = document.getElementById('playlist-panel');
const playlistList = document.getElementById('playlist-list');
const playlistTabs = document.getElementById('playlist-tabs');
const loopBtn = document.getElementById('loop-btn');
let playMode = 0; // 0=顺序播放 1=单曲循环 2=随机播放
// 按钮图标统一用内联 SVG（currentColor，随 hover 变色）
const ICONS = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    speakerOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    speakerOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>',
    mode: [
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>'
    ],
    fold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    unfold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>'
};
function setPlayIcon(playing) {
    playPauseBtn.innerHTML = playing ? ICONS.pause : ICONS.play;
}
function setVolIcon(volume) {
    const icon = document.querySelector('.vol-icon');
    if (icon) icon.innerHTML = volume > 0 ? ICONS.speakerOn : ICONS.speakerOff;
}

const playerWrap = document.getElementById('global-music-player');
const foldBtn = document.querySelector('.fold-toggle-btn');
if (foldBtn) {
    foldBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        playerWrap.classList.toggle('fold-status');
        foldBtn.innerHTML = playerWrap.classList.contains('fold-status') ? ICONS.unfold : ICONS.fold;
    });
}
// 折叠成小方框时，点击方框任意位置展开
playerWrap.addEventListener('click', function (e) {
    if (playerWrap.classList.contains('fold-status')) {
        playerWrap.classList.remove('fold-status');
        if (foldBtn) foldBtn.innerHTML = ICONS.fold;
    }
});

function loadTrack(index, restoreTime = 0) {
    const track = playlist[index];
    if (!track) return;
    albumCover.src = track.cover;
    extractCover(track); // 尝试读取 mp3 内嵌封面，读到后自动替换并广播
    songTitleSpan.textContent = track.title;
    songArtistSpan.textContent = track.artist;
    audio.src = track.src;
    audio.load();
    setPlayIcon(false);
    seekBar.value = 0;
    updateSliderFill(seekBar);
    currentTimeSpan.textContent = '00:00';
    durationTimeSpan.textContent = '00:00';
    if (restoreTime > 0) {
        audio.addEventListener('loadedmetadata', function onLoaded() {
            audio.currentTime = restoreTime;
            audio.removeEventListener('loadedmetadata', onLoaded);
        });
    }
    renderPlaylist();
    emitPlayerState();
}
function emitPlayerState() {
    if (window.__mcryiiPlayer) {
        window.dispatchEvent(new CustomEvent('mcryii:player', {
            detail: window.__mcryiiPlayer.getState()
        }));
    }
}
// ==================== 从 mp3 提取内嵌封面（ID3v2 APIC/PIC） ====================
// 歌单里的 cover 默认是占位图；这里按需 fetch 歌曲文件开头，解析出内嵌专辑封面
// 生成 blob URL 写回 track.cover，然后广播事件，让悬浮播放器/侧边栏/音乐页同步换图。
const coverCache = {}; // src -> Promise<objectURL|null>
function isId3Tag(buf) {
    return buf.length >= 10 && buf[0] === 0x49 && buf[1] === 0x44 && buf[2] === 0x33;
}
function id3TagSize(buf) {
    const size = ((buf[6] & 0x7f) << 21) | ((buf[7] & 0x7f) << 14) | ((buf[8] & 0x7f) << 7) | (buf[9] & 0x7f);
    let total = 10 + size;
    if (buf[3] === 4 && (buf[5] & 0x10)) total += 10; // v2.4 footer
    return total;
}
function parsePicFrame(tag, s) { // ID3v2.2 PIC
    if (s + 5 > tag.length) return null;
    const enc = tag[s];
    const fmt = String.fromCharCode(tag[s + 1], tag[s + 2], tag[s + 3]);
    let i = s + 5;
    if (enc === 1 || enc === 2) {
        while (i + 1 < tag.length && !(tag[i] === 0 && tag[i + 1] === 0)) i += 2;
        i += 2;
    } else {
        while (i < tag.length && tag[i] !== 0) i++;
        i++;
    }
    if (i >= tag.length) return null;
    const mime = fmt === 'PNG' ? 'image/png' : (fmt === 'JPG' || fmt === 'JPEG') ? 'image/jpeg' : 'image/' + fmt.toLowerCase();
    return { data: tag.subarray(i), mime: mime };
}
function parseApicFrame(tag, s) { // ID3v2.3/2.4 APIC
    if (s >= tag.length) return null;
    const enc = tag[s];
    let i = s + 1;
    let mime = '';
    while (i < tag.length && tag[i] !== 0) { mime += String.fromCharCode(tag[i]); i++; }
    i += (enc === 1 || enc === 2) ? 2 : 1; // MIME 终止符
    i += 1; // 图片类型
    if (enc === 1 || enc === 2) {
        while (i + 1 < tag.length && !(tag[i] === 0 && tag[i + 1] === 0)) i += 2;
        i += 2;
    } else {
        while (i < tag.length && tag[i] !== 0) i++;
        i++;
    }
    if (i >= tag.length) return null;
    return { data: tag.subarray(i), mime: mime || 'image/jpeg' };
}
function parseEmbeddedCover(tag) {
    if (!isId3Tag(tag)) return null;
    const ver = tag[3], flags = tag[5];
    const tagEnd = Math.min(tag.length, id3TagSize(tag));
    let i = 10;
    if (ver === 2) {
        if (flags & 0x40) i += 6;
        while (i + 6 <= tagEnd) {
            const fid = String.fromCharCode(tag[i], tag[i + 1], tag[i + 2]);
            const fsz = (tag[i + 3] << 16) | (tag[i + 4] << 8) | tag[i + 5];
            if (fid === 'PIC') return parsePicFrame(tag, i + 6);
            i += 6 + fsz;
        }
        return null;
    }
    if (flags & 0x40) { // 扩展头
        i += ver === 3
            ? 4 + ((tag[10] << 24) | (tag[11] << 16) | (tag[12] << 8) | tag[13])
            : 4 + (((tag[10] & 0x7f) << 21) | ((tag[11] & 0x7f) << 14) | ((tag[12] & 0x7f) << 7) | (tag[13] & 0x7f));
    }
    while (i + 10 <= tagEnd) {
        const id = String.fromCharCode(tag[i], tag[i + 1], tag[i + 2], tag[i + 3]);
        if (id === '\x00\x00\x00\x00') return null;
        const fsz = ver === 4
            ? ((tag[i + 4] & 0x7f) << 21) | ((tag[i + 5] & 0x7f) << 14) | ((tag[i + 6] & 0x7f) << 7) | (tag[i + 7] & 0x7f)
            : (tag[i + 4] << 24) | (tag[i + 5] << 16) | (tag[i + 6] << 8) | tag[i + 7];
        if (id === 'APIC') return parseApicFrame(tag, i + 10);
        i += 10 + fsz;
    }
    return null;
}
function readEmbeddedCover(src) {
    function fetchRange(to) {
        return fetch(src, { headers: { Range: 'bytes=0-' + to } })
            .then(r => {
                if (!r.ok && r.status !== 206) throw new Error('fetch failed');
                return r.arrayBuffer();
            })
            .then(ab => new Uint8Array(ab));
    }
    return fetchRange(1048575) // 先取前 1MB，覆盖绝大多数标签
        .then(buf => {
            if (!isId3Tag(buf)) throw new Error('no id3 tag');
            const size = id3TagSize(buf);
            return size <= buf.length ? buf.subarray(0, size) : fetchRange(size - 1);
        })
        .then(tag => {
            const pic = parseEmbeddedCover(tag);
            if (!pic) throw new Error('no cover');
            return URL.createObjectURL(new Blob([pic.data], { type: pic.mime }));
        });
}
function extractCover(track) {
    if (!track || track.coverResolved) return;
    track.coverResolved = true;
    if (!coverCache[track.src]) {
        coverCache[track.src] = readEmbeddedCover(track.src)
            .catch(() => track.localSrc && track.localSrc !== track.src
                ? readEmbeddedCover(track.localSrc).catch(() => null)
                : null);
    }
    coverCache[track.src].then(url => {
        if (url) track.cover = url;
        if (playlist[currentTrackIndex] === track && albumCover) {
            albumCover.src = url || track.cover;
        }
        emitPlayerState(); // 让侧边栏音乐卡 / 音乐页大唱片同步换封面
    });
}
function playPrev() {
    currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
    loadTrack(currentTrackIndex);
    audio.play().catch(e => console.log("自动播放被阻止"));
    setPlayIcon(true);
}
function applyPlayMode() {
    audio.loop = playMode === 1;
    if (loopBtn) {
        loopBtn.innerHTML = ICONS.mode[playMode];
        loopBtn.classList.toggle('active', playMode !== 0);
        loopBtn.title = playMode === 1 ? '单曲循环' : playMode === 2 ? '随机播放' : '顺序播放';
    }
}
if (loopBtn) {
    loopBtn.addEventListener('click', function () {
        playMode = (playMode + 1) % 3;
        applyPlayMode();
        localStorage.setItem('hugoPlayerMode', String(playMode));
    });
}
function playNext() {
    if (playMode === 2) {
        let idx;
        do {
            idx = Math.floor(Math.random() * playlist.length);
        } while (playlist.length > 1 && idx === currentTrackIndex);
        currentTrackIndex = idx;
    } else {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
    }
    loadTrack(currentTrackIndex);
    audio.play().catch(e => console.log("自动播放被阻止"));
    setPlayIcon(true);
}
function togglePlay() {
    if (audio.paused) {
        audio.play().catch(e => console.error("播放失败:", e));
        setPlayIcon(true);
    } else {
        audio.pause();
        setPlayIcon(false);
    }
    emitPlayerState();
}
audio.volume = volumeSlider.value;
let failedTracks = {};
audio.addEventListener('error', function() {
    const track = playlist[currentTrackIndex];
    if (!track || failedTracks[track.src]) return;
    failedTracks[track.src] = true;
    if (track.localSrc && track.localSrc !== track.src) {
        // CDN 失败时回退到本地 /music/ 文件
        console.warn('CDN 音频加载失败，回退本地:', track.src);
        track.src = track.localSrc;
        audio.src = track.src;
        audio.load();
        audio.play().catch(function () {});
    } else {
        console.warn('音频加载失败，自动跳过:', track.src);
        playNext();
    }
});
volumeSlider.addEventListener('input', function() {
    audio.volume = this.value;
    setVolIcon(audio.volume);
    updateSliderFill(volumeSlider);
});
const muteBtn = document.getElementById('mute-btn');
let lastVolume = 0.7;
if (muteBtn) {
    muteBtn.addEventListener('click', function() {
        if (audio.volume > 0) {
            lastVolume = audio.volume;
            audio.volume = 0;
            volumeSlider.value = 0;
            setVolIcon(0);
            updateSliderFill(volumeSlider);
        } else {
            audio.volume = lastVolume > 0 ? lastVolume : 0.7;
            volumeSlider.value = audio.volume;
            setVolIcon(audio.volume);
            updateSliderFill(volumeSlider);
        }
    });
}
// 滑块填充：把当前值换算成百分比写入 --fill，供 CSS 渐变渲染金色已播放/音量部分
function updateSliderFill(el) {
    const min = parseFloat(el.min) || 0;
    const max = parseFloat(el.max) || 100;
    const pct = Math.max(0, Math.min(100, ((el.value - min) / (max - min)) * 100));
    el.style.setProperty('--fill', pct + '%');
}
audio.addEventListener('loadedmetadata', function() {
    if (isFinite(audio.duration) && audio.duration > 0) {
        seekBar.max = Math.floor(audio.duration);
        durationTimeSpan.textContent = formatTime(audio.duration);
    }
    updateSliderFill(seekBar);
});
audio.addEventListener('timeupdate', function() {
    seekBar.value = Math.floor(audio.currentTime);
    currentTimeSpan.textContent = formatTime(audio.currentTime);
    updateSliderFill(seekBar);
});
seekBar.addEventListener('input', function() { audio.currentTime = this.value; updateSliderFill(this); });
seekBar.addEventListener('change', function() { audio.currentTime = this.value; updateSliderFill(this); });
updateSliderFill(seekBar);
updateSliderFill(volumeSlider);
function formatTime(seconds) {
    if (isNaN(seconds)) return '00:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
}
audio.addEventListener('ended', () => playNext());
playPauseBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', playNext);

// ==================== 播放列表 ====================
function renderPlaylist() {
    if (!playlistList) return;
    playlistList.innerHTML = '';
    playlist.forEach(function(track, i) {
        const li = document.createElement('li');
        li.innerHTML = '<span class="pl-index"></span><span class="pl-title"></span><span class="pl-artist"></span>';
        li.querySelector('.pl-index').textContent = i + 1;
        li.querySelector('.pl-title').textContent = track.title;
        li.querySelector('.pl-artist').textContent = track.artist;
        li.title = track.title;
        if (i === currentTrackIndex) li.classList.add('active');
        li.addEventListener('click', function() {
            selectTrack(i);
        });
        playlistList.appendChild(li);
    });
}

function renderPlaylistTabs() {
    if (!playlistTabs) return;
    playlistTabs.innerHTML = '';
    Object.keys(playlists).forEach(function (name) {
        const b = document.createElement('button');
        b.className = 'pl-tab' + (name === currentPlaylistName ? ' active' : '');
        b.textContent = name;
        b.addEventListener('click', function () { switchPlaylist(name); });
        playlistTabs.appendChild(b);
    });
}

function switchPlaylist(name) {
    if (!playlists[name] || name === currentPlaylistName) return;
    currentPlaylistName = name;
    playlist = playlists[name] || [];
    currentTrackIndex = 0;
    failedTracks = {};
    localStorage.setItem('hugoPlayerPlaylist', name);
    renderPlaylistTabs();
    renderPlaylist();
    if (playlist.length) loadTrack(0);
    emitPlayerState();
}

function selectTrack(index) {
    if (index < 0 || index >= playlist.length) return;
    currentTrackIndex = index;
    loadTrack(index);
    audio.play().catch(function(e) { console.log('自动播放被阻止'); });
    setPlayIcon(true);
    renderPlaylist();
}

if (playlistToggle && playlistPanel) {
    playlistToggle.addEventListener('click', function() {
        playlistPanel.classList.toggle('open');
        renderPlaylist();
    });
}

function savePlaybackState() {
    const state = { index: currentTrackIndex, time: audio.currentTime, playing: !audio.paused };
    localStorage.setItem('hugoPlayerState', JSON.stringify(state));
}
function restorePlaybackState() {
    const saved = localStorage.getItem('hugoPlayerState');
    const savedMode = localStorage.getItem('hugoPlayerMode');
    const savedPl = localStorage.getItem('hugoPlayerPlaylist');
    if (savedPl && playlists[savedPl]) {
        currentPlaylistName = savedPl;
        playlist = playlists[savedPl];
    }
    if (savedMode !== null) {
        playMode = parseInt(savedMode, 10) || 0;
        applyPlayMode();
    }
    if (saved) {
        try {
            const state = JSON.parse(saved);
            currentTrackIndex = state.index;
            savedTime = state.time;
            shouldPlay = state.playing;
            loadTrack(currentTrackIndex, savedTime);
            if (shouldPlay) {
                audio.addEventListener('canplay', function onCanPlay() {
                    audio.play().catch(e => console.log("自动播放被阻止"));
                    audio.removeEventListener('canplay', onCanPlay);
                });
                setPlayIcon(true);
            }
        } catch(e) { console.warn("恢复状态失败", e); }
    } else {
        loadTrack(0);
    }
}
window.addEventListener('beforeunload', savePlaybackState);
document.addEventListener('DOMContentLoaded', function() {
    restorePlaybackState();
    renderPlaylist();
    renderPlaylistTabs();
});

// 暴露播放器 API，供侧边栏音乐卡等组件同步状态
window.__mcryiiPlayer = {
    getState: function () {
        return {
            index: currentTrackIndex,
            track: playlist[currentTrackIndex] || null,
            playing: !audio.paused,
            currentTime: audio.currentTime,
            duration: audio.duration || 0
        };
    },
    getPlaylist: function () {
        return playlist;
    },
    getPlaylists: function () {
        return Object.keys(playlists);
    },
    getPlaylistName: function () {
        return currentPlaylistName;
    },
    switchPlaylist: switchPlaylist,
    togglePlay: togglePlay,
    playNext: playNext,
    playPrev: playPrev,
    selectTrack: selectTrack
};
</script>

<script>
(function () {
    var btn = document.getElementById('palette-toggle');
    var panel = document.getElementById('pw-panel');
    if (!btn || !panel) return;
    function apply(p, save) {
        if (!p) p = 'gold';
        document.documentElement.dataset.palette = p;
        if (save) {
            try { localStorage.setItem('mcryii-palette', p); } catch (e) {}
            try { history.replaceState(history.state, '', p === 'gold' ? location.pathname + location.search : '#palette=' + p); } catch (e) {}
        }
        panel.querySelectorAll('.pw-item').forEach(function (it) {
            it.classList.toggle('active', it.dataset.palette === p);
        });
    }
    var saved = null;
    try { saved = localStorage.getItem('mcryii-palette'); } catch (e) {}
    var hashMatch = location.hash.match(/^#palette=(\w+)/);
    if (hashMatch) saved = hashMatch[1];
    apply(saved);
    btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = panel.classList.toggle('open');
        btn.classList.toggle('open', open);
    });
    panel.addEventListener('click', function (e) {
        var it = e.target.closest('.pw-item');
        if (!it) return;
        apply(it.dataset.palette, true);
    });
    document.addEventListener('click', function (e) {
        if (!panel.classList.contains('open')) return;
        if (panel.contains(e.target) || btn.contains(e.target)) return;
        panel.classList.remove('open');
        btn.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && panel.classList.contains('open')) {
            panel.classList.remove('open');
            btn.classList.remove('open');
        }
    });
})();
</script>

<script>
window.MCRYII_InitSearch = function() {
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('search-results');
    if (!searchInput || !resultsContainer || searchInput.dataset.initialized) return;
    searchInput.dataset.initialized = '1';
    let fuse = null;
    let loadingPromise = null;
    let currentQuery = '';
    const assetsVersion = {{ site.Params.assetsVersion }};

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            return '&gt;';
        });
    }

    function renderResults() {
        if (!fuse) return;
        const minQueryLength = /[\u3400-\u9FFF\uF900-\uFAFF]/.test(currentQuery) ? 1 : 2;
        if (currentQuery.length < minQueryLength) {
            resultsContainer.innerHTML = '';
            resultsContainer.style.display = 'none';
            return;
        }
        const result = fuse.search(currentQuery);
        if (result.length === 0) {
            resultsContainer.innerHTML = '<li style="color:#ccc; text-align:center;">未找到相关内容</li>';
            resultsContainer.style.display = 'block';
            return;
        }
        const html = result.slice(0, 10).map(res => {
            const item = res.item;
            let summary = item.summary || '';
            if (summary.length > 100) summary = summary.substring(0, 100) + '…';
            const type = item.type || '页面';
            return `<li><a href="${item.permalink}"><span class="search-result-head"><span class="search-type">${escapeHtml(type)}</span><strong class="search-result-title">${escapeHtml(item.title)}</strong></span><div class="search-summary">${escapeHtml(summary)}</div></a></li>`;
        }).join('');
        resultsContainer.innerHTML = html;
        resultsContainer.style.display = 'block';
    }

    function loadFuse() {
        if (typeof Fuse !== 'undefined') return Promise.resolve();
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = `/js/fuse-6.6.2.min.js?v=${encodeURIComponent(assetsVersion)}`;
            script.onload = resolve;
            script.onerror = () => reject(new Error('Fuse.js 加载失败'));
            document.head.appendChild(script);
        });
    }

    function loadSearch() {
        if (loadingPromise) return loadingPromise;
        loadingPromise = loadFuse()
            .then(() => fetch(`/index.json?v=${encodeURIComponent(assetsVersion)}`))
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                fuse = new Fuse(data, {
                    keys: ['title', 'summary', 'categories', 'tags'],
                    threshold: 0.3,
                    includeScore: true,
                    minMatchCharLength: 1
                });
                renderResults();
            })
            .catch(err => {
                console.error('[ERROR] 加载搜索索引失败:', err);
                loadingPromise = null; // 允许下次聚焦/输入时自动重试，不必刷新页面
                resultsContainer.innerHTML = '<li style="color:#f66; text-align:center;">搜索索引加载失败，请重试</li>';
                resultsContainer.style.display = 'block';
                throw err;
            });
        return loadingPromise;
    }

    window.MCRYII_LoadSearch = loadSearch;
    searchInput.addEventListener('focus', () => { loadSearch().catch(() => {}); });
    searchInput.addEventListener('input', function() {
        currentQuery = this.value.trim();
        const minQueryLength = /[\u3400-\u9FFF\uF900-\uFAFF]/.test(currentQuery) ? 1 : 2;
        if (currentQuery.length < minQueryLength) {
            resultsContainer.style.display = 'none';
            return;
        }
        resultsContainer.innerHTML = '<li style="color:#ccc; text-align:center;">正在加载索引...</li>';
        resultsContainer.style.display = 'block';
        loadSearch().then(renderResults).catch(() => {});
    });
    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !resultsContainer.contains(e.target)) {
            resultsContainer.style.display = 'none';
        }
    });
};
document.addEventListener('DOMContentLoaded', window.MCRYII_InitSearch);
</script>

<script>
window.MCRYII_TypeHome = function() {
    if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') return;
    if (sessionStorage.getItem('mcryii-typed') === '1') return;
    const homeInfo = document.querySelector('.home-info');
    if (!homeInfo) return;

    // 只处理纯文本标题，含 HTML 元素时跳过，避免破坏结构
    function typeText(el, speed, done) {
        if (!el || el.querySelector('*') || el.dataset.typed) {
            if (done) done();
            return;
        }
        const fullText = el.textContent;
        el.textContent = '';
        let i = 0;
        const timer = setInterval(function() {
            if (!el.isConnected) { clearInterval(timer); return; } // PJAX 换页后元素已移除，停止打字
            if (i < fullText.length) {
                el.insertAdjacentText('beforeend', fullText.charAt(i));
                i++;
            } else {
                clearInterval(timer);
                el.dataset.typed = '1';
                if (done) done();
            }
        }, speed);
    }

    const h1 = homeInfo.querySelector('h1');
    const p = homeInfo.querySelector('p');
    typeText(h1, 130, function() {
        typeText(p, 55, function() {
            sessionStorage.setItem('mcryii-typed', '1');
        });
    });
};
document.addEventListener('DOMContentLoaded', window.MCRYII_TypeHome);
</script>
